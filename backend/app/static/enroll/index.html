<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AAC — Face Enrollment</title>
  <link rel="stylesheet" href="/static/enroll/style.css">
</head>
<body>

  <!-- ── Server offline banner ─────────────────────────────── -->
  <div id="server-banner" class="server-banner hidden">
    <span>⚠ Cannot reach server — check network or URL</span>
    <button onclick="checkHealth()">Retry</button>
  </div>

  <!-- ── LOGIN VIEW ─────────────────────────────────────────── -->
  <div id="view-login" class="view">
    <div class="login-wrap">
      <div class="login-logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="30" rx="14" ry="17" stroke="#00D4FF" stroke-width="2.5"/>
          <ellipse cx="26" cy="26" rx="3" ry="2" fill="#00D4FF"/>
          <ellipse cx="38" cy="26" rx="3" ry="2" fill="#00D4FF"/>
          <path d="M27 35 Q32 39 37 35" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" fill="none"/>
          <!-- brackets -->
          <path d="M12 18 L12 12 L18 12" stroke="#00A878" stroke-width="2.5" stroke-linecap="square" fill="none"/>
          <path d="M46 12 L52 12 L52 18" stroke="#00A878" stroke-width="2.5" stroke-linecap="square" fill="none"/>
          <path d="M12 46 L12 52 L18 52" stroke="#00A878" stroke-width="2.5" stroke-linecap="square" fill="none"/>
          <path d="M52 46 L52 52 L46 52" stroke="#00A878" stroke-width="2.5" stroke-linecap="square" fill="none"/>
        </svg>
      </div>
      <h1>Smart AAC Enroll</h1>
      <p class="subtitle">Face Enrollment Tool</p>

      <div class="card login-card">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div id="login-error" class="error-msg hidden"></div>
        <button id="login-btn" class="btn-primary" onclick="doLogin()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- ── SENIOR LIST VIEW ───────────────────────────────────── -->
  <div id="view-seniors" class="view hidden">
    <div class="topbar">
      <div class="topbar-title">
        <span class="topbar-icon">👥</span>
        <span>Select Senior</span>
      </div>
      <button class="btn-ghost" onclick="doLogout()">Sign Out</button>
    </div>
    <div class="search-wrap">
      <input type="search" id="senior-search" placeholder="🔍  Search by name or NRIC…"
             oninput="filterSeniors()" autocomplete="off">
    </div>
    <div id="senior-list" class="senior-list">
      <div class="list-placeholder">Loading…</div>
    </div>
  </div>

  <!-- ── ENROLL VIEW ────────────────────────────────────────── -->
  <div id="view-enroll" class="view hidden">

    <!-- Header -->
    <div class="enroll-header">
      <button class="btn-ghost back-btn" onclick="goBack()">&#8592; Back</button>
      <div class="enroll-title">
        <span id="enroll-name">Senior Name</span>
        <span id="enroll-nric" class="enroll-nric">NRIC ****0000</span>
      </div>
      <select id="camera-select" class="camera-select" onchange="switchCamera(this.value)"></select>
    </div>

    <!-- Camera + overlay -->
    <div class="camera-wrap">
      <video id="camera-video" autoplay playsinline muted></video>
      <canvas id="guide-canvas"></canvas>

      <!-- Angle prompt chip -->
      <div id="angle-chip" class="angle-chip">
        <span id="prompt-icon" class="prompt-icon"></span>
        <span id="prompt-text">Look straight ahead</span>
      </div>

      <!-- Feedback toast -->
      <div id="feedback" class="feedback hidden"></div>
    </div>

    <!-- Controls -->
    <div class="enroll-controls">
      <div class="captures-meta">
        <div id="progress-dots" class="progress-dots"></div>
        <span id="captures-label" class="captures-label">0 / 6  ·  min 3 to save</span>
      </div>

      <div id="captures-grid" class="captures-grid"></div>

      <div class="action-row">
        <button id="capture-btn" class="btn-capture" onclick="doCapture()">
          &#9711;&nbsp; Capture
        </button>
        <button id="save-btn" class="btn-save" onclick="doSave()" disabled>
          &#10515;&nbsp; Save
        </button>
      </div>
    </div>

  </div>

  <!-- ── SUCCESS OVERLAY (injected by JS) ──────────────────── -->

  <script src="/static/enroll/app.js"></script>
</body>
</html>
